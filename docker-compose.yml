services:

  app:
    build: ./app

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cruduser
      DB_PASSWORD: crudpassword
      DB_NAME: cruddb

    depends_on:
      mysql:
        condition: service_healthy


  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cruddb
      MYSQL_USER: cruduser
      MYSQL_PASSWORD: crudpassword

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  mysql_data: