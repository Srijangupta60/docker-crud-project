<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Docker CRUD Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .form-container {
            margin-bottom: 30px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Docker Node.js CRUD Project</h1>

    <!-- POST FORM -->

    <div class="form-container">

        <h2>Add User</h2>

        <input type="text" id="name" placeholder="Name">

        <input type="text" id="address" placeholder="Address">

        <input type="text" id="pin" placeholder="PIN">

        <input type="text" id="fathername" placeholder="Father Name">

        <button onclick="addUser()">POST</button>

    </div>


    <!-- GET BUTTON -->

    <button onclick="getUsers()">GET USERS</button>


    <!-- TABLE -->

    <table>

        <thead>

            <tr>
                <th>Name</th>
                <th>Address</th>
                <th>PIN</th>
                <th>Father Name</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>

        </thead>

        <tbody id="userTable">

        </tbody>

    </table>


<script>

async function addUser() {

    const name = document.getElementById("name").value;
    const address = document.getElementById("address").value;
    const pin = document.getElementById("pin").value;
    const fathername = document.getElementById("fathername").value;

    try {

        const response = await fetch("/api/users", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                address,
                pin,
                fathername
            })
        });

        const data = await response.json();

        alert(data.message);

        if (response.ok) {

            document.getElementById("name").value = "";
            document.getElementById("address").value = "";
            document.getElementById("pin").value = "";
            document.getElementById("fathername").value = "";

            getUsers();
        }

    } catch (error) {

        console.error(error);
        alert("Something went wrong");

    }
}



async function getUsers() {

    try {

        const response = await fetch("/api/users");

        const users = await response.json();

        const table = document.getElementById("userTable");

        table.innerHTML = "";

        users.forEach(user => {

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${user.name}</td>

                <td>${user.address}</td>

                <td>${user.pin}</td>

                <td>${user.fathername}</td>

                <td>
                    <button onclick="updateUser(
                        ${user.id},
                        '${escapeQuotes(user.name)}',
                        '${escapeQuotes(user.address)}',
                        '${escapeQuotes(user.pin)}',
                        '${escapeQuotes(user.fathername)}'
                    )">
                        Update
                    </button>
                </td>

                <td>
                    <button onclick="deleteUser(${user.id})">
                        Delete
                    </button>
                </td>

            `;

            table.appendChild(row);

        });

    } catch (error) {

        console.error(error);
        alert("Failed to load users");

    }
}



async function updateUser(
    id,
    currentName,
    currentAddress,
    currentPin,
    currentFatherName
) {

    const name = prompt("Enter name:", currentName);

    if (name === null) return;

    const address = prompt("Enter address:", currentAddress);

    if (address === null) return;

    const pin = prompt("Enter PIN:", currentPin);

    if (pin === null) return;

    const fathername = prompt(
        "Enter father name:",
        currentFatherName
    );

    if (fathername === null) return;


    try {

        const response = await fetch(`/api/users/${id}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                address,
                pin,
                fathername
            })

        });

        const data = await response.json();

        alert(data.message);

        if (response.ok) {
            getUsers();
        }

    } catch (error) {

        console.error(error);
        alert("Failed to update user");

    }
}



async function deleteUser(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this user?");

    if (!confirmDelete) return;


    try {

        const response = await fetch(`/api/users/${id}`, {

            method: "DELETE"

        });

        const data = await response.json();

        alert(data.message);

        if (response.ok) {
            getUsers();
        }

    } catch (error) {

        console.error(error);
        alert("Failed to delete user");

    }

}



function escapeQuotes(value) {

    return String(value)
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');

}

</script>

</body>

</html>
